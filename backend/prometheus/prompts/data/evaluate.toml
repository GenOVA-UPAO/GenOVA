[texto.1]
defaults = { num_questions = 6 }
template = '''
[ROL] Diseñador de quizzes.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_questions} preguntas progresivas: enunciado <=40 palabras, 4 opciones A/B/C/D plausibles, correcta, feedback de acierto/error <=20 palabras que explique el porqué.
[SALIDA] JSON puro con clave "preguntas": array de ${num_questions} con "enunciado","opciones","correcta","feedback_correcto","feedback_incorrecto".'''

[texto.2]
defaults = { num_criteria = 5 }
template = '''
[ROL] Diseñador de rúbricas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_criteria} criterios autoevaluables <=25 palabras; niveles inicial/en desarrollo/logrado (1-3 puntos), descriptores "Puedo..." <=30 palabras y reflexión por rango.
[SALIDA] JSON puro con claves "criterios" (array de ${num_criteria}) y "reflexiones" (objeto con rangos).'''

[texto.4]
defaults = { num_questions = 8 }
template = '''
[ROL] Examinador.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_questions} preguntas <=40 palabras; 4 opciones plausibles, una correcta y justificación <=30 palabras. Balance conceptual/aplicación/análisis/relación, sin ambigüedad.
[SALIDA] JSON puro con clave "examen": array de ${num_questions} con "numero","enunciado","opciones","correcta","justificacion","tipo".'''

[texto.6]
defaults = { num_pairs = 6 }
template = '''
[ROL] Diseñador de asociaciones.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_pairs} pares 1:1 definición-término, sin ambigüedad ni pistas. Feedback razonado de acierto/error <=20 palabras; error orienta sin revelar.
[SALIDA] JSON puro con claves "columna_a" (array de ${num_pairs}) y "parejas" (array de ${num_pairs} con a_index,b_termino,feedback_acierto,feedback_error).'''

[texto.7]
defaults = { num_terms = 8 }
template = '''
[ROL] Creador de crucigramas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_terms} términos reales sin abreviaturas: número, orientación, longitud, pista justa <=25 palabras y respuesta; cuadrícula con >=4 cruces.
[SALIDA] JSON puro con clave "entradas": array de ${num_terms} con "numero","orientacion","longitud","pista","respuesta".'''

[texto.8]
defaults = { num_questions = 3 }
template = '''
[ROL] Evaluador.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_questions} preguntas abiertas <=50 palabras (no sí/no), 3-4 criterios observables y modelo razonado <=80 palabras.
[SALIDA] JSON puro con clave "preguntas": array de ${num_questions} con "enunciado","criterios","respuesta_modelo".'''

[texto.10]
defaults = { num_competencias = 3 }
template = '''
[ROL] Diseñador de diplomas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Diploma profesional: título <=20 palabras, logro <=50, ${num_competencias} competencias medibles, firma simulada y diseño sugerido (composición, no tokens).
[SALIDA] JSON puro con claves "titulo","descripcion_logro","competencias" (array de ${num_competencias}),"firma","diseno_sugerido".'''

[codigo.3]
defaults = { time_seconds = 90, num_questions = 8 }
template = '''
[ROL] Diseñador de desafíos.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Desafío de "${concept}": ${num_questions} preguntas, ${time_seconds} s, bonus por velocidad; gestionar avance y fin de tiempo con eventos.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de responder con precisión; upao-figure: al menos un diagrama propio de contexto; upao-example: ejemplo trabajado ajeno al test antes de iniciar; upao-timer, upao-question, upao-choice, upao-score, upao-progress; retroalimentación que explique el porqué; upao-summary: cierre que consolide errores. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete(puntaje_final) al terminar.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.5]
defaults = { num_sentences = 8 }
template = '''
[ROL] Diseñador de ejercicios.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_sentences} oraciones de "${concept}" con huecos; validación JS ignora mayúsculas/acentos; "Reintentar" reinicia estado.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de usar vocabulario; upao-figure: al menos un diagrama propio contextual; upao-example: ejemplo trabajado distinto; upao-question con input, upao-status, upao-score, upao-progress; retroalimentación que explique el porqué de correcciones; upao-summary: cierre que consolide términos. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete(puntaje_final) al completar.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.9]
defaults = { num_decisions = 3 }
template = '''
[ROL] Diseñador de simulaciones.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Escenario profesional de "${concept}": ${num_decisions}-${num_decisions_plus1} decisiones, controles propios, evaluación real con criterios y pesos.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de demostrar decisiones fundadas; upao-figure: al menos un diagrama propio del escenario; upao-example: ejemplo trabajado ajeno a evaluación; upao-status, upao-score; retroalimentación que explique el porqué de cada valoración; upao-summary: cierre que consolide fortalezas y mejoras. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete(puntaje_final) al finalizar.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[html]
estilo_default = 'pagina educativa interactiva moderna'
template = '''
[ROL] Desarrollador educativo.
[CURSO] ${curso}
[OBJETIVO] Evaluar "${concept}".
[DATOS] Conserva estos datos; deriva el apoyo didáctico sin añadir hechos:
${data_json}
[FORMATO] ${estilo}
[COMPONENTES] upao-header; upao-objective con objetivo de aprendizaje; upao-figure con al menos un diagrama propio; upao-example con ejemplo trabajado ajeno a ítems evaluados cuando aplique; retroalimentación que explique el porqué; upao-summary para cierre que consolide. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete(puntaje) al finalizar.
[SALIDA] Solo el documento HTML completo desde <!DOCTYPE html>, sin markdown.'''

[html.estilos]
1 = 'Quiz: upao-question, upao-choice, upao-progress, upao-score, upao-nav. Diagrama contextual para aplicar conceptos, ejemplo previo distinto, justificar distractores y repasar errores.'
2 = 'Rúbrica: tabla nativa con niveles seleccionables, upao-score, upao-status. Diagrama de competencias para autoevaluar; ejemplo de evidencia, justificar nivel y cerrar con plan de mejora.'
4 = 'Examen: upao-question con radios nativos editables y upao-nav; corrección solo al entregar, upao-score. Diagrama contextual para analizar; ejemplo no evaluado y revisión razonada final.'
6 = 'Asociar: upao-drag-item, upao-drop-zone, upao-status, upao-score. Grafo propio contextual sin respuestas; ejemplo distinto, explicar pares y consolidar relaciones.'
7 = 'Crucigrama: cuadrícula SVG y teclado propios, upao-status, upao-progress. Añadir esquema conceptual (la cuadrícula no basta), pista análoga resuelta, justificar términos y sintetizarlos.'
8 = 'Desarrollo: upao-question con textarea, checklist y upao-reveal al comparar. Diagrama de argumentos para fundamentar; ejemplo distinto, explicar modelo y consolidar criterios.'
10 = 'Diploma: lista de competencias, firma simulada y descarga window.print. Diagrama propio de competencias (no borde decorativo); reflexión justificada y transferencia, sin ejercicio resuelto artificial.'

# F1.3 single-step: recursos de texto simple van directo a HTML (1 llamada LLM).
[codigo.8]
defaults = { num_questions = 3 }
template = '''
[ROL] Diseñador de evaluaciones.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_questions} preguntas abiertas sobre "${concept}" (<=50 palabras), textarea, checklist de 3-4 criterios observables y modelo <=80 palabras al comparar.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de fundamentar respuestas; upao-figure: al menos un diagrama propio argumental; upao-example: ejemplo trabajado distinto; upao-question, upao-reveal: retroalimentación que explique el porqué del modelo; upao-summary: cierre que consolide criterios. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete() al comparar la ultima pregunta.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.10]
defaults = { num_competencias = 3 }
template = '''
[ROL] Diseñador de diplomas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Diploma de "${concept}": título <=20 palabras, logro <=50, ${num_competencias} competencias medibles, firma simulada, descarga window.print.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de transferir logros; upao-figure: al menos un diagrama propio de competencias, no borde decorativo; retroalimentación reflexiva que explique el porqué de su utilidad; upao-summary: cierre que consolide próximos usos. No aplica ejemplo trabajado artificial; upao-example solo si ilustra transferencia. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] Al final del <script>: ${scorm}. Llama _scormComplete() al renderizar el diploma.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''
