[texto.1]
defaults = { num_markers = 4 }
template = '''
[ROL] Guionista educativo.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Storyboard: ${num_markers} marcadores cada 30 s; metáforas fieles, narración <=120 palabras con reflexión; prompt_video inglés <=100 palabras. Sin fórmulas ni jerga.
[SALIDA] JSON puro con claves "guion_visual","narracion_voz","prompt_video".'''

[texto.2]
defaults = { num_sections = 3 }
template = '''
[ROL] Redactor académico.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Lectura accesible de 250 palabras sin fórmulas: caso real, ${num_sections} ideas <=70 palabras con ejemplo razonado, pregunta y modelo; cierre de aplicaciones.
[SALIDA] JSON puro con claves "introduccion","secciones" (array de ${num_sections} con idea,ejemplo,pregunta,respuesta),"cierre".'''

[texto.4]
defaults = { num_questions = 6 }
template = '''
[ROL] Curador educativo.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_questions} dudas genuinas: respuesta <=60 palabras con analogía razonada; categoría y nivel principiante/intermedio/avanzado. Lenguaje estudiantil.
[SALIDA] JSON puro con clave "faqs": array de ${num_questions} objetos con "pregunta","respuesta","etiqueta","categoria".'''

[texto.6]
defaults = { num_terms = 8 }
template = '''
[ROL] Lexicógrafo visual.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_terms} términos: nombre <=20 caracteres, definición autocontenida <=50 palabras, emoji distinto+descripción, ejemplo real razonado <=30 palabras.
[SALIDA] JSON puro con clave "terminos": array de ${num_terms} objetos con "termino","definicion","icono_sugerido","ejemplo_concreto".'''

[texto.7]
defaults = { num_milestones = 5 }
template = '''
[ROL] Historiador.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] ${num_milestones} hitos verificables conectados causalmente: año, título <=25 caracteres, crónica 40 palabras, curiosidad y legado actual 20 palabras. Sin mitos.
[SALIDA] JSON puro con clave "hitos": array de ${num_milestones} objetos con "anio","titulo","descripcion","dato_curioso","legado_actual".'''

[texto.9]
defaults = { num_dimensions = 4 }
template = '''
[ROL] Analista comparativo.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Comparar con 3 conceptos relacionados en ${num_dimensions} dimensiones medibles: valores y balance razonado ventaja/desventaja, sin sesgo.
[SALIDA] JSON puro con claves "dimensiones" (array de ${num_dimensions}) y "comparaciones" (array de 3 con concepto,valores,balance).'''

[codigo.3]
defaults = { num_nodes = 7 }
template = '''
[ROL] Diseñador de mapas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Grafo SVG de "${concept}": ${num_nodes} nodos con text, conexiones etiquetadas, leyenda y "Explorar todo".
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de explicar relaciones; upao-figure: al menos un diagrama propio (el grafo); upao-node HTML fuera del SVG para detalles; upao-example: ejemplo trabajado de un recorrido; retroalimentación que explique el porqué de cada conexión; upao-summary: cierre que consolide relaciones. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete al explorar todos los nodos.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.5]
defaults = { num_steps = 5 }
template = '''
[ROL] Diseñador de demostraciones.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Animación propia de "${concept}" con requestAnimationFrame, play/pause/step, ${num_steps} pasos y "Repetir".
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de explicar el proceso; upao-figure: al menos un diagrama propio animado; upao-example con upao-steps y ol/li: ejemplo trabajado; upao-status y retroalimentación que explique el porqué de cada cambio; upao-summary: cierre que consolide la secuencia. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete tras todos los pasos.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.8]
defaults = { num_blocks = 5 }
template = '''
[ROL] Diseñador de diagramas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] SVG de "${concept}": ${num_blocks} bloques jerárquicos, flechas, leyenda, zoom/reset y tooltips accesibles por foco/clic.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de interpretar arquitectura; upao-figure: al menos un diagrama propio con viewBox; upao-example: ejemplo trabajado de flujo; retroalimentación que explique el porqué de la jerarquía; upao-summary: cierre que consolide función de bloques. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete al explorar todos los tooltips.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[codigo.10]
defaults = { num_sections = 5 }
template = '''
[ROL] Diseñador de infografías.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Infografía de "${concept}": ${num_sections} secciones con datos clave y revelación progresiva.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de integrar ideas; upao-figure: al menos un diagrama propio informativo, no solo iconos; upao-example: ejemplo trabajado de aplicación; upao-reveal, upao-progress y retroalimentación que explique el porqué de cada dato; upao-summary: cierre que consolide ideas. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete en la sección final.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''

[html]
estilo_default = 'pagina educativa interactiva moderna'
template = '''
[ROL] Desarrollador educativo.
[CURSO] ${curso}
[OBJETIVO] Explicar "${concept}".
[DATOS] Conserva estos datos; deriva el apoyo didáctico sin añadir hechos:
${data_json}
[FORMATO] ${estilo}
[COMPONENTES] upao-header; upao-objective con objetivo de aprendizaje; upao-figure con al menos un diagrama propio; upao-example con ejemplo trabajado; retroalimentación que explique el porqué; upao-summary para cierre que consolide. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete al completar la exploración.
[SALIDA] Solo el documento HTML completo desde <!DOCTYPE html>, sin markdown.'''

[html.estilos]
1 = 'Storyboard: upao-steps con ol/li temporal, narración y prompt copiable. Esquema del proceso para explicar teoría, metáfora razonada y síntesis; no fingir video.'
2 = 'Lectura: upao-node, upao-question, upao-reveal y upao-progress. Esquema de ideas para explicar relaciones, ejemplos razonados y cierre con aplicaciones.'
4 = 'FAQ: upao-node, filtros por categoría y upao-progress. Diagrama de dudas relacionadas; aclarar errores con contraejemplo y síntesis final.'
6 = 'Glosario: upao-node por término, filtro y expandir/colapsar. Red semántica propia; distinguir términos con ejemplo y justificación; síntesis de relaciones.'
7 = 'Timeline: upao-node por hito, upao-nav, upao-progress. Eje causal propio para explicar evolución, ejemplo de legado y cierre de continuidad/cambio.'
9 = 'Tabla nativa con caption/th, toggle de dimensiones y tooltips. Diagrama comparativo para discriminar enfoques, elección resuelta con balance y cierre de criterios.'

# F1.3 single-step: recursos de texto simple van directo a HTML (1 llamada LLM).
[codigo.2]
defaults = { num_sections = 3 }
template = '''
[ROL] Diseñador de lecturas.
[CURSO] ${curso}
[CONCEPTO] "${concept}"
[TAREA] Lectura de ~250 palabras sin fórmulas: caso real, ${num_sections} ideas <=70 palabras con ejemplo, pregunta y respuesta modelo.
[COMPONENTES] upao-header; upao-objective: objetivo de aprendizaje de explicar relaciones; upao-figure: al menos un diagrama propio de ideas; upao-node por sección, upao-example: ejemplo trabajado; upao-question, upao-reveal: retroalimentación que explique el porqué; upao-progress; upao-summary: cierre que consolide aplicaciones. CSS/JS solo para mecánica, sin redefinir tokens.
${ds}
[SCORM] ${scorm}. Desbloquea upao-complete al abrir todas las secciones y respuestas.
[SALIDA] Solo el HTML completo desde <!DOCTYPE html>, sin markdown.'''
