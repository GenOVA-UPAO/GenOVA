[project]
name = "genova-backend"
version = "0.1.0"
description = "GenOVA backend — FastAPI service for AI-assisted Virtual Learning Objects (OVA) with SCORM 1.2 export."
requires-python = ">=3.11"
readme = "../readme.md"

# Mirror of requirements.txt — kept in sync manually.
# uv reads this; pip uses requirements.txt. Both must resolve to the same set.
dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
    "python-multipart==0.0.32",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    "slowapi==0.1.10",
    "sse-starlette==3.4.5",
    "arq==0.28.0",
    "sentry-sdk[fastapi]==2.63.0",
    "prometheus-fastapi-instrumentator==8.0.2",
    # Sin extra [fastapi]: otel-instrumentation-fastapi 0.63b1 rompe con FastAPI 0.138
    # (_IncludedRouter sin `.path`) y tumba /api/*. Ver core/observability.py.
    "logfire[sqlalchemy]==4.37.0",
    "structlog==25.5.0",
    "openai==2.43.0",
    "groq==1.4.0",
    "instructor==1.15.4",
    "supabase==2.31.0",
    "google-genai==2.9.0",
    "pypdf==6.13.3",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "filetype==1.2.0",
    "langgraph==1.2.6",
    "langgraph-checkpoint-postgres==3.1.0",
    "langsmith==0.8.18",
    "pyotp==2.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.18",
    "pytest>=9.1.1",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=5.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "scorm_output", "uploads", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "S",     # bandit (security)
    "SIM",   # simplify
    "C901",  # mccabe: función demasiado compleja
    "PLR0912",  # pylint: demasiadas ramas
    "PLR0915",  # pylint: demasiados statements (función haciendo demasiado)
]
ignore = [
    "E501",   # handled by formatter
    "B008",   # FastAPI Depends() in defaults is the standard pattern
    "S101",   # asserts allowed in tests
    "S104",   # 0.0.0.0 bind is intentional in dev
    "S110",   # try-except-pass acceptable in cleanup paths
]

# Convenciones de tamaño (ver readme §Convenciones): función/método con demasiadas
# responsabilidades = error. Umbrales alineados con el frontend (~30 líneas / ~10 de
# complejidad). PLR0913 (nº de args) se activa por dominio al migrarlo — hoy es ruido
# por la DI de FastAPI.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 12
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E", "C901", "PLR0912", "PLR0915"]
"tools/**" = ["S"]
"scripts/**" = ["C901", "PLR0912", "PLR0915"]
"seed.py" = ["S105", "S106", "PLR0915"]
"run_migrations.py" = ["PLR0915"]
"main.py" = ["E402"]
"ova/history_router.py" = ["E402"]
# Deuda de tamaño en dominios aún no migrados a hexagonal — cada línea se elimina
# cuando su dominio pasa por el refactor (Fase 2). `roles/` ya migrado (Fase 1).
"users/**" = ["C901", "PLR0912", "PLR0915"]
"generation/**" = ["C901", "PLR0912", "PLR0915"]
"llm/**" = ["C901", "PLR0912", "PLR0915"]
# Subdominio de soporte (motor LangGraph): exento de las reglas de tamaño de función
# por diseño (KISS) — ver readme §Convenciones.
"prometheus/**" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.importlinter]
# Los módulos de dominio son paquetes top-level (pythonpath = "."), no `backend.*`.
# `lint-imports` se ejecuta desde `backend/`.
root_packages = [
    "core", "auth", "ova", "llm", "rag", "roles",
    "users", "scorm", "generation", "prometheus", "storage", "uploads",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El kernel (core) no depende de ningún dominio"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "auth", "ova", "llm", "rag", "roles",
    "users", "scorm", "generation", "prometheus", "storage", "uploads",
]

# --- roles: hexagonal estricto (piloto) ---

[[tool.importlinter.contracts]]
name = "roles.domain es puro (sin capas externas ni frameworks)"
type = "forbidden"
source_modules = ["roles.domain"]
forbidden_modules = [
    "roles.application", "roles.infrastructure", "roles.interface", "roles.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "roles.application no depende de infraestructura/interface ni frameworks"
type = "forbidden"
source_modules = ["roles.application"]
forbidden_modules = [
    "roles.infrastructure", "roles.interface", "roles.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "roles: capas (interface -> container -> application -> domain)"
type = "layers"
layers = [
    "roles.interface",
    "roles.container",
    "roles.application",
    "roles.domain",
]

# --- storage: adaptador outbound puro (sin HTTP, sin ORM, sin dominios) ---

[[tool.importlinter.contracts]]
name = "storage es un adaptador outbound aislado"
type = "forbidden"
source_modules = ["storage"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "starlette",
    "auth", "ova", "llm", "rag", "roles",
    "users", "scorm", "generation", "prometheus", "uploads",
]

# --- uploads: hexagonal estricto ---

[[tool.importlinter.contracts]]
name = "uploads.domain es puro (sin capas externas ni frameworks)"
type = "forbidden"
source_modules = ["uploads.domain"]
forbidden_modules = [
    "uploads.application", "uploads.infrastructure", "uploads.interface", "uploads.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "uploads.application no depende de infraestructura/interface ni frameworks"
type = "forbidden"
source_modules = ["uploads.application"]
forbidden_modules = [
    "uploads.infrastructure", "uploads.interface", "uploads.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette", "rag",
]

[[tool.importlinter.contracts]]
name = "uploads: capas (interface -> container -> application -> domain)"
type = "layers"
layers = [
    "uploads.interface",
    "uploads.container",
    "uploads.application",
    "uploads.domain",
]

# --- scorm: dominio puro (ensamblado de paquetes SCORM, sin I/O ni orquestación) ---

[[tool.importlinter.contracts]]
name = "scorm.domain es puro (sin frameworks ni otros dominios)"
type = "forbidden"
source_modules = ["scorm.domain"]
forbidden_modules = [
    "scorm.interface",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
    "auth", "ova", "llm", "rag", "roles",
    "users", "generation", "prometheus", "storage", "uploads",
]

# --- rag: hexagonal estricto ---

[[tool.importlinter.contracts]]
name = "rag.domain es puro (sin capas externas ni frameworks)"
type = "forbidden"
source_modules = ["rag.domain"]
forbidden_modules = [
    "rag.application", "rag.infrastructure", "rag.interface", "rag.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "rag.application no depende de infraestructura/interface ni frameworks"
type = "forbidden"
source_modules = ["rag.application"]
forbidden_modules = [
    "rag.infrastructure", "rag.interface", "rag.container",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "rag: capas (interface -> container -> application -> domain)"
type = "layers"
layers = [
    "rag.interface",
    "rag.container",
    "rag.application",
    "rag.domain",
]

# --- auth: reorganización estructural en capas (la extracción de los flujos a
#     casos de uso es un segundo pase; los routers todavía llevan la lógica). ---

[[tool.importlinter.contracts]]
name = "auth.domain es puro (sin capas externas ni frameworks)"
type = "forbidden"
source_modules = ["auth.domain"]
forbidden_modules = [
    "auth.infrastructure", "auth.interface",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "auth.infrastructure no depende de la capa de interface"
type = "forbidden"
source_modules = ["auth.infrastructure"]
forbidden_modules = ["auth.interface"]

[[tool.importlinter.contracts]]
name = "auth: capas (interface -> infrastructure -> domain)"
type = "layers"
layers = [
    "auth.interface",
    "auth.infrastructure",
    "auth.domain",
]

# --- prometheus / llm / generation: subdominios de soporte (tratamiento ligero).
#     No adoptan la ceremonia hexagonal; se les fija el perímetro con contratos. ---

[[tool.importlinter.contracts]]
name = "prometheus (motor LangGraph) es un leaf: sin HTTP ni dominios superiores"
type = "forbidden"
source_modules = ["prometheus"]
forbidden_modules = [
    "fastapi", "starlette",
    "auth", "users", "ova", "roles", "scorm", "uploads", "generation",
]
# El kernel `core` sí toca fastapi/starlette (commit_or_500, logging middleware);
# lo que se prohíbe es que `prometheus` tenga acoplamiento HTTP propio.
ignore_imports = [
    "core.database -> fastapi",
    "core.logging_setup -> starlette",
]

[[tool.importlinter.contracts]]
name = "llm no depende de dominios superiores"
type = "forbidden"
source_modules = ["llm"]
forbidden_modules = ["users", "ova", "roles", "scorm", "uploads", "generation"]

[[tool.importlinter.contracts]]
name = "las capas de utilidad de llm son framework-free"
type = "forbidden"
source_modules = [
    "llm.providers", "llm.clients", "llm.images",
    "llm.podcast", "llm.utils", "llm.ova_components",
]
forbidden_modules = ["fastapi", "starlette"]
# `core.database` importa fastapi.HTTPException (commit_or_500); no es acoplamiento
# HTTP propio de la capa de utilidad.
ignore_imports = ["core.database -> fastapi"]

[[tool.importlinter.contracts]]
name = "generation no depende de roles ni de auth.infrastructure"
type = "forbidden"
source_modules = ["generation"]
forbidden_modules = ["roles", "auth.infrastructure"]

# --- users: pase estructural en capas (la extracción de cada router a casos de
#     uso es un 2º pase, como en `auth`). ---

[[tool.importlinter.contracts]]
name = "users.domain es puro (sin capas externas ni frameworks)"
type = "forbidden"
source_modules = ["users.domain"]
forbidden_modules = [
    "users.application", "users.infrastructure", "users.interface",
    "fastapi", "sqlalchemy", "pydantic", "starlette",
]

[[tool.importlinter.contracts]]
name = "users.infrastructure no depende de application ni interface"
type = "forbidden"
source_modules = ["users.infrastructure"]
forbidden_modules = ["users.application", "users.interface"]

[[tool.importlinter.contracts]]
name = "users no depende de generation/scorm/rag/storage"
type = "forbidden"
source_modules = ["users"]
forbidden_modules = ["generation", "scorm", "rag", "storage"]
# `users.interface.http.admin_nodes_config_router` sí configura `prometheus.config`
# (endpoint admin para tunear el motor de generación) — dependencia legítima.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "bdd: BDD scenarios via pytest-bdd",
]
