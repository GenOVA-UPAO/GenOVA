version: 2
updates:
  # GitHub Actions de los workflows → última versión (incluye setup-uv, que no
  # tiene alias de major y se fija por tag completo).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Frontend + tests (pnpm workspace: un solo lockfile en la raíz).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # Minor/patch en un único PR semanal; cada major llega aparte para poder
    # probarla y revertirla por separado.
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 rompe typescript-eslint y ESLint 10 no es compatible con
      # eslint-plugin-react 7.x (ver #165/#166). Quitar cuando lo sean.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  # Backend: ecosystem 'uv' (actualiza pyproject.toml + uv.lock juntos).
  # NOTA: requirements.txt es un espejo; tras un PR de uv corre
  #   python backend/scripts/sync_deps.py --write
  # para realinearlo (el check de paridad de CI lo exige).
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # Minor/patch en un único PR semanal; cada major llega aparte.
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # openai >=3.4 exige jiter>=0.16 e instructor 1.17 pide jiter<0.15: uv no
      # puede resolver ("No solution found when resolving dependencies") y el job
      # falla cada semana. Quitar cuando instructor admita jiter>=0.16.
      - dependency-name: "openai"
        versions: [">3.3.0"]
