name: Plantillas OVA

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/ova_engine/**'
      - 'backend/tests/fixtures/ova_engine/**'
      - 'backend/scripts/ova_engine_render.py'
      - 'backend/llm/ova_components/**'
      - 'backend/llm/utils/**'
      - 'tests/templates/**'
      - 'tests/playwright.templates.config.js'
      - 'tests/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/templates.yml'
  workflow_dispatch:

concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: Plantillas (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: astral-sh/setup-uv@v10.2.0
        with: { enable-cache: true }
      - name: Dependencias y render de fixtures reales
        run: |
          uv pip install --system -r backend/requirements.txt
          python backend/scripts/ova_engine_render.py tests/.ova-rendered --fixtures
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: templates-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter genova-tests exec playwright install --with-deps chromium
      - run: pnpm --filter genova-tests test:templates --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: templates-${{ matrix.shard }}
          path: |
            tests/playwright-report-templates/
            tests/test-results/
