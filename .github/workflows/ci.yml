name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Un push nuevo a la misma ref cancela el run anterior (solo PRs): dos suites
# E2E solapadas agotan el pooler compartido de Supabase (EMAXCONNSESSION).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install

      - run: pnpm lint

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with: { enable-cache: true }

      - run: uvx ruff check backend/

      - name: Deps parity (pyproject <-> requirements)
        run: python3 scripts/sync_deps.py --check
        working-directory: backend

      - name: Fronteras de arquitectura (import-linter)
        run: uv sync --extra dev && uv run lint-imports
        working-directory: backend

      - name: Tamaño de módulos (aviso)
        run: uv run python scripts/check_module_size.py
        working-directory: backend

  backend-bdd:
    name: Backend BDD (pytest-bdd)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      # Pool acotado: 3 jobs levantan backend contra el mismo pooler de Supabase;
      # con el default (10+10 por proceso) dos runs solapados lo agotan.
      DB_POOL_SIZE: '3'
      DB_MAX_OVERFLOW: '3'
      BASE: http://localhost:8000
      GROQ_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      OPENROUTER_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      # Los escenarios de HU-001 validan el flujo de verificación, que está
      # desactivado por defecto en producción. Se fuerza aquí para probarlo.
      EMAIL_VERIFICATION_ENABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }

      - uses: astral-sh/setup-uv@v8.2.0
        with: { enable-cache: true }

      - name: Install backend deps
        run: uv pip install --system -r requirements-dev.txt
        working-directory: backend

      - name: Start backend (under coverage)
        run: |
          coverage run --parallel-mode -m uvicorn main:app --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && echo "backend ready" && exit 0
            echo "waiting... ($i/40)"
            sleep 5
          done
          echo "=== Backend failed to start — startup log ==="
          cat /tmp/backend.log
          exit 1

      - name: Run BDD step defs + unit (under coverage)
        run: coverage run --parallel-mode -m pytest tests/step_defs/ tests/test_llm_config_store.py tests/test_rag_injection.py tests/test_scorm_package.py tests/test_auth_validation.py tests/test_auth_throttle.py tests/test_c14_orm_delete_cascade.py -v --tb=short
        working-directory: backend

      - name: Stop backend (flush coverage)
        run: |
          kill -INT "$(cat /tmp/backend.pid)" 2>/dev/null || true
          sleep 4
        working-directory: backend

      - name: Coverage report + gate
        run: |
          coverage combine
          coverage report
          coverage xml
        working-directory: backend

  # Caja negra automatizada: Schemathesis genera cientos de casos desde el
  # OpenAPI que expone FastAPI y verifica contratos (códigos, schemas, 500s).
  # TODO: retirar continue-on-error cuando la primera pasada quede estable.
  api-contract:
    name: API contract (Schemathesis)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      # Pool acotado: 3 jobs levantan backend contra el mismo pooler de Supabase;
      # con el default (10+10 por proceso) dos runs solapados lo agotan.
      DB_POOL_SIZE: '3'
      DB_MAX_OVERFLOW: '3'
      GROQ_API_KEY: dummy-ci-key-not-used-by-contract-tests
      OPENROUTER_API_KEY: dummy-ci-key-not-used-by-contract-tests
      LLM_FAKE: '1'
      RATE_LIMIT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }

      - uses: astral-sh/setup-uv@v8.2.0
        with: { enable-cache: true }

      - name: Install backend deps
        run: uv pip install --system -r requirements-dev.txt
        working-directory: backend

      - name: Start backend
        run: uvicorn main:app --port 8000 > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && echo "backend ready" && exit 0
            echo "waiting... ($i/40)"
            sleep 5
          done
          cat /tmp/backend.log
          exit 1

      - name: Get bearer token (seed admin)
        id: auth
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@genova.ai","password":"admin1234password"}' | jq -r .access_token)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Schemathesis
        run: |
          uvx --from 'schemathesis>=4,<5' schemathesis run \
            http://localhost:8000/openapi.json \
            --header "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            --max-examples 20 \
            --exclude-path-regex '^/api/ova/jobs' \
            --report junit --report-junit-path schemathesis-report.xml \
            | tee schemathesis-output.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schemathesis-report
          path: |
            schemathesis-report.xml
            schemathesis-output.txt

  frontend-unit:
    name: Frontend Unit BDD (cucumber-js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install

      - run: pnpm test:unit

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Audita solo dependencias de PRODUCCIÓN (las de dev/test las cubre Dependabot).
      - name: pnpm audit (prod)
        run: pnpm audit --prod --audit-level high

      - uses: astral-sh/setup-uv@v8.2.0
        with: { enable-cache: true }

      - name: pip-audit (backend)
        run: uvx pip-audit -r requirements.txt
        working-directory: backend

  e2e:
    name: E2E BDD (playwright-bdd)
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, backend-bdd, frontend-unit]
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
      # Pool acotado: 3 jobs levantan backend contra el mismo pooler de Supabase;
      # con el default (10+10 por proceso) dos runs solapados lo agotan.
      DB_POOL_SIZE: '3'
      DB_MAX_OVERFLOW: '3'
      BASE_URL: http://localhost:4200
      GROQ_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      OPENROUTER_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      # La suite e2e ampliada genera OVAs reales: LLM_FAKE los completa en segundos
      # sin proveedores, y el rate limit apagado evita 429 con ~20 logins seguidos.
      LLM_FAKE: '1'
      RATE_LIMIT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install

      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/package.json') }}
          restore-keys: playwright-chromium-

      - run: pnpm --filter genova-tests exec playwright install --with-deps chromium

      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }

      - uses: astral-sh/setup-uv@v8.2.0
        with: { enable-cache: true }

      - name: Install backend deps
        run: uv pip install --system -r requirements-dev.txt
        working-directory: backend

      - name: Start backend
        run: uvicorn main:app --port 8000 > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && echo "backend ready" && exit 0
            echo "waiting... ($i/40)"
            sleep 5
          done
          echo "=== Backend failed to start — startup log ==="
          cat /tmp/backend.log
          exit 1

      - run: pnpm test:e2e

      # Auditoría de accesibilidad (axe-core, WCAG 2.0 A/AA) reutilizando el
      # mismo backend; el gate detecta violaciones serious/critical.
      # TODO: quitar continue-on-error cuando se corrijan las violaciones que
      # la primera pasada encontró (2026-07-08): color-contrast (marca
      # text-accent-brand y 7 nodos más), list/listitem (gn-sidebar-nav-item
      # directo bajo <ul> en el sidebar), button-name (1 botón icónico) y
      # aria-input-field-name (1 select sin nombre accesible).
      - name: A11y audit (axe-core, informativo)
        continue-on-error: true
        run: pnpm test:a11y

      - name: Debug backend on failure
        if: failure()
        run: |
          echo "=== Backend startup log ==="
          cat /tmp/backend.log || echo "(no log file)"
          echo "=== Login probe ==="
          curl -v -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@genova.ai","password":"admin1234password"}' \
            2>&1 || true

      # El reporte HTML (con screenshots, traces y video de los fallos) se sube
      # SIEMPRE: es el sustituto gratuito de TestSprite para revisar los tests.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/playwright-report-a11y
