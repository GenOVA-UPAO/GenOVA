# E2E nocturno AUTÓNOMO: levanta Postgres, backend y frontend dentro del propio
# job (igual que el job `e2e` de ci.yml), sin depender de ningún despliegue.
# No existe despliegue de develop, así que no se apunta a una URL remota.
#
#   gh workflow run e2e-develop.yml                          # app local, todos los escenarios
#   gh workflow run e2e-develop.yml -f tags=@smoke           # solo @smoke
#   gh workflow run e2e-develop.yml -f base_url=https://...  # entorno externo (sin app local)
#   gh run watch                                             # seguir el run en vivo
#   gh run download -n playwright-report-develop             # bajar reporte HTML + videos
#
# - Cron diario sobre `develop`; workflow_dispatch sobre la rama elegida.
# - Sin llamadas LLM reales: LLM_FAKE=1 (OVAs deterministas) y claves dummy.
# - `tags` vacío (por defecto) = suite completa (@smoke + escenarios de
#   generación, HU-008, HU-018...), más amplia que los @smoke de los PR.
# - `base_url` opcional: si se informa, NO se levanta backend ni Vite y la suite
#   corre contra ese frontend (E2E_EXTERNAL=1). Con Vercel Deployment Protection
#   hace falta el secret VERCEL_AUTOMATION_BYPASS_SECRET.
#   OJO: contra un backend real los escenarios de generación gastarían cuota
#   LLM; usa `tags=@smoke` en ese caso.

name: E2E develop

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL de un frontend externo (vacío = levantar la app dentro del job)'
        required: false
        default: ''
      tags:
        description: 'Expresión de tags Gherkin (vacío = suite completa; ej. "@smoke")'
        required: false
        default: ''
  schedule:
    # Diario 07:00 UTC sobre develop.
    - cron: '0 7 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-develop:
    name: Playwright E2E (app local, LLM_FAKE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EXTERNAL_URL: ${{ inputs.base_url }}
      BDD_TAGS: ${{ inputs.tags }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/genova_test
      JWT_SECRET: ci-solo-para-github-actions-no-es-un-secreto-real
      DB_POOL_SIZE: '5'
      DB_MAX_OVERFLOW: '5'
      GROQ_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      OPENROUTER_API_KEY: dummy-ci-key-not-used-by-bdd-tests
      LLM_FAKE: '1'
      RATE_LIMIT_ENABLED: '0'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          # El cron corre en la rama por defecto; el E2E nocturno prueba develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Configurar destino (local o externo)
        run: |
          if [ -n "$EXTERNAL_URL" ]; then
            echo "E2E_EXTERNAL=1" >> "$GITHUB_ENV"
            echo "BASE_URL=$EXTERNAL_URL" >> "$GITHUB_ENV"
            echo "MODE=externo" >> "$GITHUB_ENV"
          else
            echo "BASE_URL=http://localhost:4200" >> "$GITHUB_ENV"
            echo "MODE=local" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/package.json') }}
          restore-keys: playwright-chromium-

      - run: pnpm --filter genova-tests exec playwright install --with-deps chromium

      - uses: actions/setup-python@v7
        if: env.MODE == 'local'
        with: { python-version: '3.11' }

      - uses: astral-sh/setup-uv@v10.2.0
        if: env.MODE == 'local'
        with: { enable-cache: true }

      - name: Install backend deps
        if: env.MODE == 'local'
        run: uv pip install --system -r requirements-dev.txt
        working-directory: backend

      - name: Start backend
        if: env.MODE == 'local'
        run: uvicorn main:app --port 8000 > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        if: env.MODE == 'local'
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health && echo "backend ready" && exit 0
            echo "waiting... ($i/40)"
            sleep 5
          done
          echo "=== Backend failed to start — startup log ==="
          cat /tmp/backend.log
          exit 1

      # Playwright webServer (tests/playwright.config.js) levanta Vite en :4200;
      # su proxy reenvía /api al backend de :8000. BDD_TAGS vacío = todo.
      - name: Run E2E
        run: pnpm test:e2e

      - name: Debug backend on failure
        if: failure() && env.MODE == 'local'
        run: |
          echo "=== Backend log ==="
          tail -n 200 /tmp/backend.log || echo "(no log file)"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## E2E develop"
            echo "- Modo: $MODE"
            echo "- Frontend: $BASE_URL"
            echo "- Tags: ${BDD_TAGS:-(suite completa)}"
            echo "- Estado: ${{ job.status }}"
            echo "- Reporte: artifact \`playwright-report-develop\` (HTML + traces + video)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-develop
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
