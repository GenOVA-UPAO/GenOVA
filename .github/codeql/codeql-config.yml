name: "GenOVA CodeQL config"

# Excluye assets generados / vendorizados que no son código del producto:
# reportes de JMeter/Locust y Lighthouse traen bundles minificados de terceros
# (jQuery, D3, Bootstrap…) que disparan cientos de alertas falsas
# (js/prototype-pollution-utility, js/overly-large-range, etc.).
paths-ignore:
  - 'tests/load'
  - 'tests/lighthouse-reports'
  - '**/*.report.html'
  - '**/jmeter-report/**'
  - '**/bower_components/**'
  - '.claude/skills'
  - '.agents/skills'
  - 'docs/wireframes'
  # Snippets que Playwright evalúa dentro del navegador (los carga
  # `prepare_ova_visual.py`): son una expresión suelta, no un módulo, así que
  # CodeQL los lee como programa y avisa de «expresión sin efecto».
  - '**/*.browser.js'

# Reglas de calidad (nivel «note») descartadas por falsos positivos sistemáticos:
# - py/unused-global-variable: se dispara con globales que solo se reasignan con
#   `global X` (cachés, contadores) y con constantes que se usan desde otro módulo.
query-filters:
  - exclude:
      id: py/unused-global-variable
