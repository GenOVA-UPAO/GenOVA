services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: genova-backend-prod
    # Un solo proceso uvicorn (Dockerfile.prod). Si se sube a varios
    # (WEB_CONCURRENCY>1), define REDIS_URL en backend/.env y añade un servicio
    # redis y el worker arq (backend/Dockerfile.worker): sin Redis el límite por IP
    # queda por proceso; con Redis y sin worker la generación se queda en cola.
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - genova-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: genova-frontend-prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - genova-net

networks:
  genova-net:
    driver: bridge
