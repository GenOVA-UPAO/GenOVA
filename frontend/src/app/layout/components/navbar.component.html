    <header class="z-50 border-b border-border bg-card">
      <div class="flex h-14 items-center gap-3 px-4 sm:px-6">
        <button
          type="button"
          (click)="drawerOpen.set(true)"
          class="-ml-1 rounded-lg p-2 text-muted-foreground transition-colors hover:bg-accent md:hidden"
          aria-label="Abrir menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            fill="currentColor"
            viewBox="0 0 256 256"
          >
            <path
              d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"
            />
          </svg>
        </button>
        <gn-navbar-brand />
        <div class="flex-1"></div>
        <a
          routerLink="/crear"
          class="hidden items-center gap-1.5 rounded-lg bg-primary px-3.5 py-2 text-sm font-semibold text-primary-foreground shadow-sm transition-opacity hover:opacity-90 sm:flex"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            viewBox="0 0 256 256"
          >
            <path
              d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"
            />
          </svg>
          Crear OVA
        </a>
        <div class="relative" #dropdownRef>
          <button
            type="button"
            (click)="avatarOpen.update((v) => !v)"
            class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-bold text-primary-foreground shadow-sm transition hover:opacity-90 active:scale-95"
            aria-label="Menu de usuario"
          >
            {{ initials() }}
          </button>
          @if (avatarOpen()) {
            <div
              class="absolute right-0 top-11 z-50 w-56 rounded-xl border border-border bg-card py-1 shadow-xl animate-in fade-in zoom-in-95 duration-150"
            >
              <div class="border-b border-border px-4 py-2.5">
                <p class="truncate text-sm font-semibold">
                  {{ user()?.full_name || 'Usuario GenOVA' }}
                </p>
                <p class="truncate text-xs text-muted-foreground">
                  {{ user()?.email || 'sesion activa' }}
                </p>
              </div>
              <a
                routerLink="/profile"
                class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-accent"
                (click)="avatarOpen.set(false)"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm0-80a48,48,0,1,0-48-48A48.05,48.05,0,0,0,128,136Zm0-80a32,32,0,1,1-32,32A32,32,0,0,1,128,56Z"
                    opacity="0.2"
                  />
                  <path
                    d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm0-80a48,48,0,1,0-48-48A48.05,48.05,0,0,0,128,136Zm0-80a32,32,0,1,1-32,32A32,32,0,0,1,128,56Z"
                  />
                </svg>
                Mi Perfil
              </a>
              <button
                type="button"
                (click)="openThemeModal()"
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm hover:bg-accent"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M232,104H208V64a16,16,0,0,0-16-16H64A16,16,0,0,0,48,64v40H24a8,8,0,0,0-8,8v32a56.06,56.06,0,0,0,56,56,8,8,0,0,0,8-8V120a8,8,0,0,1,16,0v72a8,8,0,0,0,8,8,56.06,56.06,0,0,0,56-56v-32A8,8,0,0,0,232,104Z"
                    opacity="0.2"
                  />
                  <path
                    d="M232,104H208V64a16,16,0,0,0-16-16H64A16,16,0,0,0,48,64v40H24a8,8,0,0,0-8,8v32a56.06,56.06,0,0,0,56,56,8,8,0,0,0,8-8V120a8,8,0,0,1,16,0v72a8,8,0,0,0,8,8,56.06,56.06,0,0,0,56-56v-32A8,8,0,0,0,232,104Z"
                  />
                </svg>
                Apariencia
              </button>
              <button
                type="button"
                (click)="handleLogout()"
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-destructive hover:bg-accent"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 256 256"
                >
                  <path
                    d="M112,216a8,8,0,0,1-8,8H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h56a8,8,0,0,1,0,16H48V208h56A8,8,0,0,1,112,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-34.35,34.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,221.66,122.34Z"
                    opacity="0.2"
                  />
                  <path
                    d="M112,216a8,8,0,0,1-8,8H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h56a8,8,0,0,1,0,16H48V208h56A8,8,0,0,1,112,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-34.35,34.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,221.66,122.34Z"
                  />
                </svg>
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </div>

      @if (themeModalOpen()) {
        <gn-theme-modal [initialTheme]="themeSettings()" (onClose)="themeModalOpen.set(false)" />
      }

      @if (drawerOpen()) {
        <button
          type="button"
          class="fixed inset-0 z-40 bg-foreground/30 md:hidden"
          (click)="drawerOpen.set(false)"
          aria-label="Cerrar menu"
        ></button>
        <aside
          class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-sidebar shadow-xl md:hidden"
        >
          <div class="flex items-center justify-between border-b border-sidebar-border px-4 py-4">
            <gn-navbar-brand />
            <button
              type="button"
              (click)="drawerOpen.set(false)"
              class="rounded-lg p-1.5 text-muted-foreground hover:bg-accent"
              aria-label="Cerrar menu"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"
                />
              </svg>
            </button>
          </div>
          <gn-sidebar-menu [onNavigate]="closeDrawer" />
        </aside>
      }
    </header>
