<header class="z-50 border-b border-border bg-card">
  <div class="flex h-14 items-center gap-3 px-4 sm:px-6">
    <button
      type="button"
      (click)="drawerOpen.set(true)"
      class="-ml-1 rounded-lg p-2 text-muted-foreground transition-colors hover:bg-accent md:hidden"
      aria-label="Abrir menú"
    >
      <gn-icon name="list" size="text-xl" />
    </button>
    <gn-navbar-brand />
    <div class="flex-1"></div>
    <a
      routerLink="/crear"
      class="hidden items-center gap-1.5 rounded-lg bg-primary px-3.5 py-2 text-sm font-semibold text-primary-foreground shadow-sm transition-opacity hover:opacity-90 sm:flex"
    >
      <gn-icon name="plus" size="text-base" />
      Crear OVA
    </a>
    <div class="relative" #dropdownRef>
      <button
        #avatarBtnRef
        type="button"
        (click)="avatarOpen.update((v) => !v)"
        class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-bold text-primary-foreground shadow-sm transition hover:opacity-90 active:scale-95"
        aria-label="Menú de usuario"
        aria-haspopup="menu"
        [attr.aria-expanded]="avatarOpen()"
      >
        {{ initials() }}
      </button>
      @if (avatarOpen()) {
        <div
          role="menu"
          class="absolute right-0 top-11 z-50 w-56 rounded-xl border border-border bg-card py-1 shadow-xl animate-in fade-in zoom-in-95 duration-150"
        >
          <div class="border-b border-border px-4 py-2.5">
            <p class="truncate text-sm font-semibold">
              {{ user()?.full_name || "Usuario GenOVA" }}
            </p>
            <p class="truncate text-xs text-muted-foreground">
              {{ user()?.email || "sesión activa" }}
            </p>
          </div>
          <a
            routerLink="/profile"
            role="menuitem"
            class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-accent"
            (click)="avatarOpen.set(false)"
          >
            <gn-icon name="user-circle" size="text-base" />
            Mi Perfil
          </a>
          <a
            routerLink="/vinculacion"
            role="menuitem"
            class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-accent"
            (click)="avatarOpen.set(false)"
          >
            <gn-icon name="link" size="text-base" />
            Vinculación
          </a>
          @if (canAnalytics) {
            <a
              routerLink="/analytics"
              role="menuitem"
              class="flex items-center gap-2 px-4 py-2 text-sm hover:bg-accent"
              (click)="avatarOpen.set(false)"
            >
              <gn-icon name="chart-bar" size="text-base" />
              Analítica
            </a>
          }
          <button
            type="button"
            role="menuitem"
            (click)="openThemeModal()"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm hover:bg-accent"
          >
            <gn-icon name="palette" size="text-base" />
            Apariencia
          </button>
          <button
            type="button"
            role="menuitem"
            (click)="cycleTheme()"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm hover:bg-accent"
          >
            <gn-icon [name]="themeIcon()" size="text-base" />
            {{ themeLabel() }}
          </button>
          <button
            type="button"
            role="menuitem"
            (click)="handleLogout()"
            class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-destructive hover:bg-accent"
          >
            <gn-icon name="sign-out" size="text-base" />
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>

  @if (themeModalOpen()) {
    <gn-theme-modal [initialTheme]="themeSettings()" (onClose)="themeModalOpen.set(false)" />
  }

  @if (drawerOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-foreground/30 md:hidden"
      (click)="drawerOpen.set(false)"
      aria-label="Cerrar menú"
    ></button>
    <aside class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-sidebar shadow-xl md:hidden">
      <div class="flex items-center justify-between border-b border-sidebar-border px-4 py-4">
        <gn-navbar-brand />
        <button
          type="button"
          (click)="drawerOpen.set(false)"
          class="rounded-lg p-1.5 text-muted-foreground hover:bg-accent"
          aria-label="Cerrar menú"
        >
          <gn-icon name="x" size="text-xl" />
        </button>
      </div>
      <gn-sidebar-menu [onNavigate]="closeDrawer" />
    </aside>
  }
</header>
