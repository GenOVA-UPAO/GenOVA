@if (open()) {
  <div
    role="presentation"
    class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-foreground/40"
    (click)="onClose.emit()"
    [gnModalDismiss]="dismissModal"
  >
    <div
      role="presentation"
      class="relative w-full max-w-md rounded-2xl border border-border bg-background shadow-2xl overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <div class="px-5 pt-5 pb-4 border-b border-border/60 bg-muted/20">
        <h2 class="text-base font-bold text-foreground">Conectar proveedor</h2>
        <p class="text-[11px] text-muted-foreground mt-1">
          Selecciona un proveedor para añadir tu API key.
        </p>
      </div>

      <div class="p-4 space-y-2.5">
        @for (p of providers; track p.id) {
          <button
            type="button"
            (click)="select(p.id)"
            class="w-full flex items-start gap-3.5 rounded-xl px-4 py-3.5 text-left border border-border/50 hover:border-primary/40 hover:bg-primary/[.025] transition duration-150 group"
          >
            <span
              class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border/60 bg-muted/50 text-base font-bold text-muted-foreground group-hover:border-primary/30 group-hover:bg-primary/5 group-hover:text-primary transition"
            >
              {{ p.icon }}
            </span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="text-sm font-bold text-foreground">{{ p.label }}</span>
                @if (p.badge) {
                  <span
                    class="rounded-full px-2 py-0.5 text-[9px] font-black uppercase tracking-wide"
                    [ngClass]="p.badgeColor"
                  >
                    {{ p.badge }}
                  </span>
                }
              </div>
              <p class="text-xs text-muted-foreground leading-relaxed">{{ p.desc }}</p>
            </div>
            <span
              class="shrink-0 mt-1 text-muted-foreground/30 group-hover:text-primary transition-colors"
              >→</span
            >
          </button>
        }
      </div>

      <div
        class="mx-4 mb-4 flex items-start gap-2 rounded-lg border border-border/40 bg-muted/30 px-3 py-2.5"
      >
        <span class="shrink-0 mt-0.5 text-muted-foreground/60 text-xs">ℹ</span>
        <p class="text-[11px] text-muted-foreground leading-relaxed">
          Para acceder a modelos de
          <span class="font-semibold text-foreground">Anthropic, OpenAI, Google, Mistral</span>
          y más — conecta
          <span class="font-semibold text-foreground">OpenRouter</span>
          con tu cuenta.
        </p>
      </div>

      <div class="px-4 pb-4 flex justify-end">
        <gn-button
          size="sm"
          variant="ghost"
          (onClick)="onClose.emit()"
          class="text-xs text-muted-foreground"
        >
          Cancelar
        </gn-button>
      </div>
    </div>
  </div>
}
