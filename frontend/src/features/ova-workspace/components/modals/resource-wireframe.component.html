<div class="flex h-full w-full flex-col overflow-hidden bg-background">
  <div class="flex h-5 shrink-0 items-center gap-1 border-b border-border bg-muted/60 px-2">
    @for (i of threeItems; track i) {
      <span class="h-1.5 w-1.5 rounded-full bg-muted-foreground/25"></span>
    }
  </div>
  <div class="flex flex-1 items-center justify-center p-3" [style.color]="phaseColor()">
    @switch (sketchGroup()) {
      @case ("media") {
        <gn-wireframe-sketches-media class="block h-full w-full" [wire]="wire()" />
      }
      @case ("interact") {
        <gn-wireframe-sketches-interact class="block h-full w-full" [wire]="wire()" />
      }
      @case ("assess") {
        <gn-wireframe-sketches-assess class="block h-full w-full" [wire]="wire()" />
      }
      @default {
        <div class="h-2/3 w-2/3 rounded-md border-2 border-dashed border-muted-foreground/40"></div>
      }
    }
  </div>
</div>
