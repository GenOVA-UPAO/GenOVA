@if (phases.length) {
  <section class="rounded-xl border border-border bg-background shadow-sm">
    <header class="border-b border-border px-5 py-4">
      <h2 class="text-lg font-semibold">Vista previa del OVA — Modelo 5E</h2>
      @if (content?.title) {
        <p class="mt-0.5 text-sm text-muted-foreground line-clamp-1" [title]="content!.title!">
          {{ content!.title }}
        </p>
      }
    </header>

    <div role="tablist" aria-label="Fases del modelo 5E" class="flex flex-wrap gap-1 border-b border-border px-5 py-3">
      @for (phase of phases; track phase.id; let i = $index) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="i === activeIndex"
          [attr.aria-controls]="'panel-' + phase.id"
          [id]="'tab-' + phase.id"
          (click)="selectTab(i)"
          class="rounded-lg px-3.5 py-1.5 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          [class]="i === activeIndex ? colors(phase.id).tab : 'bg-muted text-muted-foreground hover:bg-muted/80'"
        >
          {{ phase.label }}
        </button>
      }
    </div>

    @if (activePhase) {
      <div
        [id]="'panel-' + activePhase.id"
        role="tabpanel"
        [attr.aria-labelledby]="'tab-' + activePhase.id"
        class="px-5 py-5"
      >
        <gn-ova-phase-panel [phase]="activePhase" [colors]="colors(activePhase.id)" />
      </div>
    }
  </section>
}
