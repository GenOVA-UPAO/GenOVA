server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (las mismas que vercel.json) solo en los bloques
    # estáticos: Nginx no hereda los add_header del server en un location que
    # declara los suyos, y en el proxy las pone el backend (las rutas LTI se
    # dejan enmarcar por el LMS con su propio frame-ancestors).

    # Subidas: hasta UPLOAD_MAX_FILES (5) × UPLOAD_MAX_FILE_SIZE_MB (20) más el
    # sobrecoste multipart; el 1 MB por defecto de Nginx las cortaba con 413.
    client_max_body_size 105m;

    # Assets con hash generados por Vite: cache larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html nunca debe cachearse para garantizar actualizaciones inmediatas
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gateway: /api/* y /auth/* van al backend del compose (mismo origen, así
    # las cookies de sesión no necesitan CORS). Sin sufijo en proxy_pass para
    # conservar la ruta; sin buffering para los streams SSE de generación.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Gateway hacia el backend (mismas rutas que el proxy de Vite, más LTI y
    # salud): sin esto, /api/* caía en el fallback SPA y devolvía index.html
    # (GET) o 405 (POST), y nadie podía iniciar sesión con `pnpm prod:docker`.
    location ~ ^/(api|auth|lti)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE del progreso de generación (/api/jobs/{id}/stream): sin búfer.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Fallback SPA para todas las demás rutas
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
