server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash generados por Vite: cache larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html nunca debe cachearse para garantizar actualizaciones inmediatas
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Gateway hacia el backend (mismas rutas que el proxy de Vite, más LTI y
    # salud): sin esto, /api/* caía en el fallback SPA y devolvía index.html
    # (GET) o 405 (POST), y nadie podía iniciar sesión con `pnpm prod:docker`.
    location ~ ^/(api|auth|lti)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE del progreso de generación (/api/jobs/{id}/stream): sin búfer.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Fallback SPA para todas las demás rutas
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
