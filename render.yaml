# render.yaml — Blueprint de despliegue del backend de GenOVA en Render.
# Spec: https://render.com/docs/blueprint-spec
#
# Uso: Render Dashboard → New → Blueprint → conectar el repo GenOVA-UPAO/GenOVA.
# Render lee este archivo, crea el servicio y pide en el dashboard los valores
# marcados `sync: false` (secretos: no se commitean). El resto queda fijado aquí.
#
# Sustituye a `.railway/railway.ts` (Railway). NO se despliega Redis ni el worker
# arq: sin REDIS_URL, la generación de OVA corre en un hilo dentro del proceso web
# (backend/generation/jobs/jobs_router_helpers.py). Suficiente para este entorno.
#
# Un solo proceso web (sin WEB_CONCURRENCY ni numInstances) y sin REDIS_URL:
# - límites por email del login y de «Probar un modelo»: se comparten en Postgres
#   (tabla throttle_hits), valen igual con uno o varios procesos;
# - límite por IP (SlowAPI): en memoria del proceso, exacto con un solo proceso.
# Para escalar (WEB_CONCURRENCY>1 o varias instancias) hace falta REDIS_URL y el
# worker arq: ver el bloque comentado al final. Sin él, el backend avisa al
# arrancar («rate limits per process»).
#
# Tras un despliegue que cambie el modelo de embeddings (p. ej. a
# gemini-embedding-2) hay que reindexar el RAG a mano: el backend lo avisa al
# arrancar («hay fragmentos embebidos con otro modelo») y el procedimiento está en
# el readme, «Reindexar embeddings del RAG». No se automatiza con
# preDeployCommand: en Render solo existe en instancias de pago y re-embeber
# gasta cuota/dinero de Gemini en cada despliegue.

services:
  - type: web
    name: genova-backend
    runtime: docker
    repo: https://github.com/GenOVA-UPAO/GenOVA
    branch: main
    # El Dockerfile hace `COPY backend/...`, así que el contexto es la raíz del repo.
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: .
    # us-west: la más cercana a Supabase (aws-1-us-west-1) — minimiza la latencia
    # backend↔BD, que es la ruta crítica. El frontend en Vercel se sirve por CDN.
    region: oregon
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # ─── Núcleo (obligatorio) ───────────────────────────────────────────────
      - key: ENV
        value: production
      # Supabase → Connection string → Transaction pooler (puerto 6543).
      # Formato: postgresql+psycopg://postgres.<REF>:<PASSWORD>@<REGION>.pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
      # >=16 chars o el backend no arranca. Render genera uno aleatorio fuerte.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "1440"
      - key: AUTH_ACCEPT_BEARER
        value: "0"
      # Orígenes del frontend en Vercel (CSV). Obligatorio con ENV=production.
      - key: CORS_ORIGINS
        value: https://gen-ova-frontend.vercel.app
      # Origen del frontend para construir enlaces (reset de contraseña,
      # verificación de correo). Sin esto el backend avisa que apunta a localhost.
      - key: FRONTEND_URL
        value: https://gen-ova-frontend.vercel.app
      # Frontend y backend en dominios distintos → cookie cross-site.
      - key: COOKIE_SAMESITE
        value: none
      - key: LOG_LEVEL
        value: INFO

      # NO configurar Redis aquí: con un valor, arq encola los jobs, pero este
      # Blueprint no crea worker y quedarían esperando para siempre. Vacío activa
      # el hilo del servidor. REDIS_URL también es el almacén de SlowAPI y de
      # core.shared_throttle: obligatorio si se sube a varios procesos/instancias
      # (ver el bloque «Escalar» al final), junto con el worker.
      - key: REDIS_URL
        value: ""
      # Un recurso a la vez reduce los picos de RAM del proceso único del plan gratuito.
      - key: OVA_GEN_CONCURRENCY
        value: "1"

      # ─── Pool de BD — free tier de Supabase ────────────────────────────────
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"

      # ─── Proveedores LLM (al menos GROQ u OPENROUTER para generar OVA) ──────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      # Requerido si RAG_EMBEDDER=gemini* (default). Sin él, pon RAG_DISABLED=1.
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        value: https://gen-ova-frontend.vercel.app

      # ─── Supabase Storage (persistencia de .zip SCORM) ─────────────────────
      # Sin estas 3, el backend cae a disco local efímero (se pierde al redeploy).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: scorm-packages

      # ─── Imágenes (opcional) ──────────────────────────────────────────────
      - key: HF_TOKEN
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: RUNWARE_API_KEY
        sync: false
      - key: FALAI_API_KEY
        sync: false
      - key: CF_AI_API_KEY
        sync: false

      # ─── SMTP — recuperación de contraseña (opcional) ──────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

# ─── Escalar a varios procesos o instancias (opcional, NO activo) ─────────────
# Con WEB_CONCURRENCY>1 o numInstances>1 los límites por IP de SlowAPI dejan de
# ser exactos sin Redis. Para activarlo: descomentar, quitar `value: ""` de
# REDIS_URL arriba y poner en su lugar el `fromService`. El Key Value tiene plan
# free (sin persistencia: basta para límites y la cola), pero el worker arq es un
# servicio `worker`, que en Render no tiene plan gratuito.
#
#  - type: keyvalue
#    name: genova-kv
#    region: oregon
#    plan: free
#    maxmemoryPolicy: noeviction   # la cola arq no puede perder trabajos
#    ipAllowList: []               # solo red interna de Render
#
#  - type: worker
#    name: genova-worker
#    runtime: docker
#    dockerfilePath: ./backend/Dockerfile.worker
#    dockerContext: .
#    region: oregon
#    plan: starter
#    envVars:
#      - fromGroup: ...            # mismas variables que el web (BD, claves LLM, RAG…)
#
#  En el web (y el worker), en lugar de `value: ""`:
#      - key: REDIS_URL
#        fromService:
#          type: keyvalue
#          name: genova-kv
#          property: connectionString
